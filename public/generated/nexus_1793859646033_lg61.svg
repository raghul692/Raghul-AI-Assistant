<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="hsl(327, 70%, 12%)" />
      <stop offset="50%" stop-color="hsl(42, 65%, 8%)" />
      <stop offset="100%" stop-color="#05060b" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="hsl(147, 90%, 60%)" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="hsl(147, 90%, 60%)" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="340" fill="url(#glow)"/>
  <g filter="url(#shadow)">
    <polygon points="512,220 780,480 680,820 344,820 244,480" fill="none" stroke="hsl(327, 90%, 65%)" stroke-width="4" opacity="0.8"/>
    <circle cx="512" cy="512" r="180" fill="none" stroke="hsl(147, 95%, 70%)" stroke-width="3" opacity="0.9"/>
    <circle cx="512" cy="512" r="100" fill="hsl(42, 80%, 25%)" opacity="0.5"/>
  </g>
  <text x="512" y="880" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" letter-spacing="1">A hyper-detailed cybernetic artific</text>
  <text x="512" y="920" text-anchor="middle" fill="hsl(327, 90%, 75%)" font-family="system-ui, -apple-system, sans-serif" font-size="16" letter-spacing="3">NEXUS GENERATIVE CANVAS</text>
</svg>