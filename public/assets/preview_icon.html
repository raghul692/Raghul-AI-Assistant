<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raghul AI — Official Icon System</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #090a0f;
      color: #ececec;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 36px;
    }
    .header-group {
      text-align: center;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 8px 0;
      background: linear-gradient(135deg, #00f0ff, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #8e8e93;
      margin: 0;
      font-size: 14px;
    }
    .cards-container {
      display: flex;
      gap: 28px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 1100px;
    }
    .icon-card {
      background: #12141c;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 320px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .icon-card:hover {
      transform: translateY(-4px);
      border-color: rgba(0, 240, 255, 0.3);
    }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: #ececec;
    }
    .card-badge {
      font-size: 11px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 10px;
      background: rgba(0, 240, 255, 0.12);
      color: #00f0ff;
      border: 1px solid rgba(0, 240, 255, 0.25);
    }
    .main-preview-img {
      width: 220px;
      height: 220px;
      border-radius: 48px;
      object-fit: cover;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
    }
    .scales-row {
      display: flex;
      align-items: flex-end;
      gap: 16px;
      margin-top: 8px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      width: 100%;
      justify-content: center;
    }
    .scale-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .scale-item span {
      font-size: 10px;
      color: #71717a;
      font-family: monospace;
    }
    .s-48 { width: 48px; height: 48px; border-radius: 12px; }
    .s-28 { width: 28px; height: 28px; border-radius: 7px; }
    .s-16 { width: 16px; height: 16px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="header-group">
    <h1>Raghul AI — App Icon System</h1>
    <p>Premium, developer-grade app icon variations tailored for your AI platform</p>
  </div>

  <div class="cards-container">
    <!-- Option 1 -->
    <div class="icon-card">
      <div style="display:flex; justify-content:space-between; width:100%; align-items:center;">
        <span class="card-title">Option 1: Titanium & Glass</span>
        <span class="card-badge">Apple / VisionOS</span>
      </div>
      <img src="raghul_ai_app_icon_v1.jpg" class="main-preview-img" alt="Option 1">
      <div class="scales-row">
        <div class="scale-item">
          <img src="raghul_ai_app_icon_v1.jpg" class="s-48" alt="48px">
          <span>48px</span>
        </div>
        <div class="scale-item">
          <img src="raghul_ai_app_icon_v1.jpg" class="s-28" alt="28px">
          <span>28px</span>
        </div>
        <div class="scale-item">
          <img src="raghul_ai_app_icon_v1.jpg" class="s-16" alt="16px">
          <span>16px</span>
        </div>
      </div>
    </div>

    <!-- Option 2 -->
    <div class="icon-card">
      <div style="display:flex; justify-content:space-between; width:100%; align-items:center;">
        <span class="card-title">Option 2: Cybernetic Neon-Rail</span>
        <span class="card-badge">Linear / Raycast</span>
      </div>
      <img src="raghul_ai_app_icon_v2.jpg" class="main-preview-img" alt="Option 2">
      <div class="scales-row">
        <div class="scale-item">
          <img src="raghul_ai_app_icon_v2.jpg" class="s-48" alt="48px">
          <span>48px</span>
        </div>
        <div class="scale-item">
          <img src="raghul_ai_app_icon_v2.jpg" class="s-28" alt="28px">
          <span>28px</span>
        </div>
        <div class="scale-item">
          <img src="raghul_ai_app_icon_v2.jpg" class="s-16" alt="16px">
          <span>16px</span>
        </div>
      </div>
    </div>

    <!-- Option 3 (SVG Code Vector) -->
    <div class="icon-card">
      <div style="display:flex; justify-content:space-between; width:100%; align-items:center;">
        <span class="card-title">Option 3: Scalable Vector SVG</span>
        <span class="card-badge">Code / Web Native</span>
      </div>
      <img src="raghul_ai_icon.svg" class="main-preview-img" alt="Option 3">
      <div class="scales-row">
        <div class="scale-item">
          <img src="raghul_ai_icon.svg" class="s-48" alt="48px">
          <span>48px</span>
        </div>
        <div class="scale-item">
          <img src="raghul_ai_icon.svg" class="s-28" alt="28px">
          <span>28px</span>
        </div>
        <div class="scale-item">
          <img src="raghul_ai_icon.svg" class="s-16" alt="16px">
          <span>16px</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
