<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c14"/>
      <stop offset="50%" stop-color="#07090e"/>
      <stop offset="100%" stop-color="#030407"/>
    </linearGradient>

    <!-- Subtle Radial Glow Behind Symbol -->
    <radialGradient id="glowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#A855F7" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#07090e" stop-opacity="0"/>
    </radialGradient>

    <!-- R Stem Linear Gradient (Cyan to Electric Blue) -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="40%" stop-color="#00C4FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- R Top Loop Gradient (Cyan to Bright Magenta) -->
    <linearGradient id="loopGrad" x1="0%" y1="0%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="35%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C026D3"/>
    </linearGradient>

    <!-- R Diagonal Leg Gradient (Vibrant Violet to Pink Glow) -->
    <linearGradient id="legGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#C026D3"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <!-- Orbit Swoosh Gradient (Neon Cyan -> Electric Purple -> Magenta) -->
    <linearGradient id="orbitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E879F9"/>
      <stop offset="45%" stop-color="#A855F7"/>
      <stop offset="75%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="ambientGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feComposite in="SourceGraphic" in2="blur2" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Base Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2"/>
  
  <!-- Subtle Internal Highlight Rim -->
  <rect x="18" y="18" width="476" height="476" rx="106" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1.5"/>

  <!-- Radial Core Glow -->
  <circle cx="256" cy="256" r="220" fill="url(#glowGlow)"/>

  <!-- Back Segment of Orbital Ring (passes behind the R) -->
  <path d="M 120 370 C 50 330, 90 220, 210 170 C 310 130, 420 150, 460 210" 
        fill="none" 
        stroke="url(#orbitGrad)" 
        stroke-width="14" 
        stroke-linecap="round" 
        opacity="0.45"
        filter="url(#softGlow)"/>

  <!-- Main "R" Icon Assembly -->
  <g id="letterRMark">
    <!-- 1. Left Vertical Stem -->
    <path d="M 148 132 L 196 132 C 200 132, 204 136, 204 140 L 204 372 C 204 376, 200 380, 196 380 L 148 380 C 144 380, 140 376, 140 372 L 140 140 C 140 136, 144 132, 148 132 Z" 
          fill="url(#stemGrad)"/>

    <!-- 2. Upper Loop of R -->
    <path d="M 204 132 L 286 132 C 342 132, 376 166, 376 218 C 376 270, 338 302, 282 302 L 204 302 Z 
             M 204 178 L 278 178 C 312 178, 328 194, 328 218 C 328 242, 310 256, 276 256 L 204 256 Z" 
          fill="url(#loopGrad)"/>

    <!-- 3. Dynamic Diagonal Leg of R -->
    <path d="M 272 284 L 340 374 C 344 378, 350 380, 356 380 L 396 380 C 404 380, 408 372, 402 366 L 322 268 C 308 274, 292 280, 272 284 Z" 
          fill="url(#legGrad)"/>

    <!-- Neural / AI Circuit Nodes inside the Loop Area -->
    <!-- Neural Node 1 (Core) -->
    <circle cx="256" cy="217" r="7.5" fill="#00F0FF" filter="url(#softGlow)"/>
    <circle cx="256" cy="217" r="3.5" fill="#FFFFFF"/>
    
    <!-- Neural Branch Connections -->
    <path d="M 204 217 L 248 217" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <path d="M 256 217 L 290 196" stroke="#818CF8" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <path d="M 256 217 L 290 238" stroke="#A855F7" stroke-width="3" stroke-linecap="round" opacity="0.85"/>

    <!-- Secondary Node (Upper) -->
    <circle cx="290" cy="196" r="5" fill="#A855F7" filter="url(#softGlow)"/>
    <circle cx="290" cy="196" r="2" fill="#FFFFFF"/>

    <!-- Secondary Node (Lower) -->
    <circle cx="290" cy="238" r="5" fill="#C026D3" filter="url(#softGlow)"/>
    <circle cx="290" cy="238" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Front Segment of Orbital Ring (cuts dynamically across the front with glow) -->
  <path d="M 86 376 C 130 430, 260 410, 360 340 C 420 298, 458 244, 462 206" 
        fill="none" 
        stroke="url(#orbitGrad)" 
        stroke-width="16" 
        stroke-linecap="round"
        filter="url(#ambientGlow)"/>
  
  <path d="M 86 376 C 130 430, 260 410, 360 340 C 420 298, 458 244, 462 206" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="3" 
        stroke-linecap="round" 
        opacity="0.75"/>

  <!-- Leading Orbital Sparkle / Quantum Pulse -->
  <circle cx="462" cy="206" r="6" fill="#00F0FF" filter="url(#softGlow)"/>
  <circle cx="462" cy="206" r="2.5" fill="#FFFFFF"/>

  <circle cx="86" cy="376" r="5" fill="#F472B6" filter="url(#softGlow)"/>
  <circle cx="86" cy="376" r="2" fill="#FFFFFF"/>
</svg>

