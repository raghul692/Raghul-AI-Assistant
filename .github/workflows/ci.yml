name: Raghul AI Continuous Integration

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Test Suites & Security Guardrails
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Initialize Data Directory
        run: mkdir -p data/generated/documents data/generated/research_reports

      - name: Execute Master Test Suite
        run: npm test

